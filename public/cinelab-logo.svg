<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Vignette/Gradient if needed -->
    <radialGradient id="darkBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c0d11" />
      <stop offset="100%" stop-color="#020305" />
    </radialGradient>

    <!-- Chrome / Silver 3D Gradient for CINE -->
    <linearGradient id="chromeBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="28%" stop-color="#E2E8F0" />
      <stop offset="48%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="52%" stop-color="#475569" />
      <stop offset="78%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <linearGradient id="chromeFace" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#F1F5F9" />
      <stop offset="55%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- 24K Gold Gradient for LAB -->
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="48%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="52%" stop-color="#78350F" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <linearGradient id="goldFace" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3" />
      <stop offset="30%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Film Ribbon Gold Gradient -->
    <linearGradient id="filmRibbon" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="20%" stop-color="#D97706" />
      <stop offset="45%" stop-color="#FEF08A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Lens Aperture Gradients -->
    <radialGradient id="apertureCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="65%" stop-color="#0f172a" />
      <stop offset="90%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>

    <radialGradient id="apertureGleam" cx="35%" cy="30%" r="40%">
      <stop offset="0%" stop-color="rgba(254, 240, 138, 0.7)" />
      <stop offset="50%" stop-color="rgba(245, 158, 11, 0.2)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <!-- 3D Extrusion Shadow Filter -->
    <filter id="shadow3d" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.95" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. CELLULOID FILM STRIP RIBBON (Curling from top-right over CINE and down the left) -->
  <g opacity="0.95" filter="url(#shadow3d)">
    <!-- Back loop of film strip -->
    <path
      d="M 580 45 C 450 40, 240 60, 100 135 C 40 168, 15 220, 25 270 C 35 320, 95 345, 180 340 C 130 330, 48 300, 42 260 C 36 215, 75 165, 140 128 C 265 60, 470 50, 580 45 Z"
      fill="#451a03"
      opacity="0.5"
    />
    <!-- Main golden film ribbon -->
    <path
      d="M 680 75 C 500 55, 310 75, 175 135 C 105 168, 45 210, 30 255 C 15 300, 45 335, 110 345 C 80 330, 45 295, 55 255 C 68 215, 125 170, 195 138 C 330 80, 515 65, 680 75 Z"
      fill="url(#filmRibbon)"
      stroke="#78350F"
      stroke-width="1.5"
    />
    <!-- Film sprocket perforations along top curve -->
    <g fill="#050505" stroke="#92400e" stroke-width="0.8">
      <rect x="220" y="88" width="10" height="15" rx="2" transform="rotate(-18 225 95)" />
      <rect x="260" y="78" width="10" height="15" rx="2" transform="rotate(-14 265 85)" />
      <rect x="300" y="70" width="10" height="15" rx="2" transform="rotate(-10 305 77)" />
      <rect x="340" y="65" width="10" height="15" rx="2" transform="rotate(-6 345 72)" />
      <rect x="382" y="62" width="10" height="15" rx="2" transform="rotate(-2 387 69)" />
      <rect x="424" y="61" width="10" height="15" rx="2" transform="rotate(2 429 68)" />
      <rect x="466" y="63" width="10" height="15" rx="2" transform="rotate(5 471 70)" />
      <rect x="508" y="67" width="10" height="15" rx="2" transform="rotate(8 513 74)" />
      <rect x="550" y="73" width="10" height="15" rx="2" transform="rotate(11 555 80)" />

      <!-- Left curve sprockets -->
      <rect x="175" y="112" width="10" height="14" rx="2" transform="rotate(-25 180 119)" />
      <rect x="135" y="138" width="10" height="14" rx="2" transform="rotate(-35 140 145)" />
      <rect x="100" y="170" width="10" height="14" rx="2" transform="rotate(-48 105 177)" />
      <rect x="74" y="208" width="10" height="14" rx="2" transform="rotate(-62 79 215)" />
      <rect x="58" y="250" width="10" height="14" rx="2" transform="rotate(-78 63 257)" />
      <rect x="55" y="292" width="10" height="14" rx="2" transform="rotate(-92 60 299)" />
    </g>

    <!-- Lower film track connecting to right -->
    <path
      d="M 680 75 C 780 82, 890 120, 950 175 C 990 215, 995 265, 960 305 C 920 340, 840 350, 760 345 C 830 338, 900 325, 935 295 C 965 265, 960 225, 925 190 C 870 140, 775 105, 680 75 Z"
      fill="url(#filmRibbon)"
      stroke="#78350F"
      stroke-width="1.2"
    />
    <g fill="#050505" stroke="#92400e" stroke-width="0.8">
      <rect x="730" y="88" width="10" height="15" rx="2" transform="rotate(18 735 95)" />
      <rect x="775" y="105" width="10" height="15" rx="2" transform="rotate(25 780 112)" />
      <rect x="822" y="127" width="10" height="15" rx="2" transform="rotate(32 827 134)" />
      <rect x="868" y="155" width="10" height="15" rx="2" transform="rotate(40 873 162)" />
      <rect x="910" y="190" width="10" height="15" rx="2" transform="rotate(50 915 197)" />
      <rect x="938" y="235" width="10" height="15" rx="2" transform="rotate(65 943 242)" />
      <rect x="942" y="280" width="10" height="15" rx="2" transform="rotate(80 947 287)" />
    </g>
  </g>

  <!-- 2. MAIN LOGO TEXT: CINELAB -->
  <g id="main-typography" filter="url(#shadow3d)">
    <!-- 3D Drop Extrusion Shadows -->
    <text
      x="88"
      y="266"
      font-family="Montserrat, 'Arial Black', -apple-system, sans-serif"
      font-size="192"
      font-weight="900"
      letter-spacing="-1"
      fill="#050505"
      dx="6"
      dy="10"
      opacity="0.9"
    >CINE</text>

    <text
      x="564"
      y="266"
      font-family="Montserrat, 'Arial Black', -apple-system, sans-serif"
      font-size="192"
      font-weight="900"
      letter-spacing="-1"
      fill="#281103"
      dx="6"
      dy="10"
      opacity="0.9"
    >LAB</text>

    <!-- Extrusion Sides (Chrome CINE) -->
    <text
      x="88"
      y="266"
      font-family="Montserrat, 'Arial Black', -apple-system, sans-serif"
      font-size="192"
      font-weight="900"
      letter-spacing="-1"
      fill="#334155"
      stroke="#1E293B"
      stroke-width="12"
      stroke-linejoin="round"
    >CINE</text>

    <!-- Front Face (Chrome CINE) -->
    <text
      x="88"
      y="266"
      font-family="Montserrat, 'Arial Black', -apple-system, sans-serif"
      font-size="192"
      font-weight="900"
      letter-spacing="-1"
      fill="url(#chromeFace)"
      stroke="url(#chromeBevel)"
      stroke-width="3.5"
    >CINE</text>

    <!-- Extrusion Sides (Gold LAB) -->
    <text
      x="564"
      y="266"
      font-family="Montserrat, 'Arial Black', -apple-system, sans-serif"
      font-size="192"
      font-weight="900"
      letter-spacing="-1"
      fill="#78350F"
      stroke="#451A03"
      stroke-width="12"
      stroke-linejoin="round"
    >LAB</text>

    <!-- Front Face (Gold LAB) -->
    <text
      x="564"
      y="266"
      font-family="Montserrat, 'Arial Black', -apple-system, sans-serif"
      font-size="192"
      font-weight="900"
      letter-spacing="-1"
      fill="url(#goldFace)"
      stroke="url(#goldBevel)"
      stroke-width="3.5"
    >LAB</text>

    <!-- CAMERA IRIS APERTURE inside the letter 'A' of LAB (x ≈ 736, y ≈ 202) -->
    <g transform="translate(736, 202)">
      <!-- Outer metallic gold bezel -->
      <circle cx="0" cy="0" r="38" fill="url(#apertureCenter)" stroke="url(#goldBevel)" stroke-width="4" />
      <circle cx="0" cy="0" r="34" fill="#020617" stroke="#92400E" stroke-width="1" />
      <!-- Aperture blades -->
      <g stroke="url(#goldBevel)" stroke-width="1.6" fill="none" opacity="0.95">
        <path d="M 0 -34 L 18 -10 L 32 -10" />
        <path d="M 29 -17 L 27 12 L 20 28" />
        <path d="M 27 20 L 2 29 L -18 28" />
        <path d="M -16 30 L -30 9 L -32 -8" />
        <path d="M -32 -6 L -16 -27 L 0 -34" />
        <path d="M 12 -31 L -12 -18 L -24 0" />
      </g>
      <!-- Center optical aperture opening -->
      <polygon points="0,-12 11,-4 11,8 0,14 -11,8 -11,-4" fill="#000000" stroke="#FDE047" stroke-width="1.5" />
      <circle cx="0" cy="0" r="7" fill="#020617" />
      <circle cx="0" cy="0" r="34" fill="url(#apertureGleam)" pointer-events="none" />
      <ellipse cx="-10" cy="-12" rx="9" ry="5" transform="rotate(-30 -10 -12)" fill="rgba(255,255,255,0.7)" />
    </g>
  </g>

  <!-- 3. ÉCOLE WITH HORIZONTAL ACCENT LINES -->
  <g id="ecole-section" transform="translate(500, 335)">
    <!-- Left horizontal gold line -->
    <line x1="-310" y1="-8" x2="-80" y2="-8" stroke="url(#goldBevel)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="-315" cy="-8" r="3" fill="#FDE047" />

    <!-- ÉCOLE Text in gleaming gold -->
    <text
      x="0"
      y="6"
      text-anchor="middle"
      font-family="'Times New Roman', Georgia, serif"
      font-size="44"
      font-weight="700"
      letter-spacing="14"
      fill="url(#goldBevel)"
      stroke="#78350F"
      stroke-width="0.8"
      filter="url(#subtleGlow)"
    >ÉCOLE</text>

    <!-- Right horizontal gold line -->
    <line x1="80" y1="-8" x2="310" y2="-8" stroke="url(#goldBevel)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="315" cy="-8" r="3" fill="#FDE047" />
  </g>

  <!-- 4. LABORATÓRIO DE CINEMA & AUDIOVISUAL (Crisp, High-Contrast White with Gold &) -->
  <g id="laboratorio-section" transform="translate(500, 388)">
    <text
      x="0"
      y="0"
      text-anchor="middle"
      font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="25"
      font-weight="900"
      letter-spacing="5"
      fill="#FFFFFF"
      filter="url(#shadow3d)"
    >
      LABORATÓRIO DE CINEMA <tspan fill="url(#goldBevel)">&amp;</tspan> AUDIOVISUAL
    </text>
  </g>

  <!-- 5. ONDE NASCEM OS PRÓXIMOS CINEASTAS (Gold with flanking lines) -->
  <g id="slogan-section" transform="translate(500, 432)">
    <!-- Thin line left -->
    <line x1="-380" y1="-4" x2="-230" y2="-4" stroke="url(#goldBevel)" stroke-width="1.8" />
    <circle cx="-384" cy="-4" r="2" fill="#FDE047" />

    <text
      x="0"
      y="2"
      text-anchor="middle"
      font-family="Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="17"
      font-weight="600"
      letter-spacing="6"
      fill="url(#goldBevel)"
    >ONDE NASCEM OS PRÓXIMOS CINEASTAS</text>

    <!-- Thin line right -->
    <line x1="230" y1="-4" x2="380" y2="-4" stroke="url(#goldBevel)" stroke-width="1.8" />
    <circle cx="384" cy="-4" r="2" fill="#FDE047" />
  </g>
</svg>
